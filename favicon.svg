<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="watermelonRind" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="70%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
    <radialGradient id="watermelonFlesh" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#090f1a"/>
  <!-- Watermelon slice -->
  <path d="M 12 32 A 20 20 0 0 0 52 32 Z" fill="url(#watermelonRind)"/>
  <path d="M 15 32 A 17 17 0 0 0 49 32 Z" fill="#c8e6c9"/>
  <path d="M 17 32 A 15 15 0 0 0 47 32 Z" fill="url(#watermelonFlesh)"/>
  <!-- Seeds -->
  <ellipse cx="26" cy="37" rx="1.5" ry="2.5" fill="#212121" transform="rotate(-20 26 37)"/>
  <ellipse cx="32" cy="40" rx="1.5" ry="2.5" fill="#212121"/>
  <ellipse cx="38" cy="37" rx="1.5" ry="2.5" fill="#212121" transform="rotate(20 38 37)"/>
  <!-- Slicing Katana blade across -->
  <path d="M 6 14 Q 32 30 58 50" stroke="url(#blade)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Spark -->
  <polygon points="34,26 36,31 41,33 36,35 34,40 32,35 27,33 32,31" fill="#ffffff"/>
</svg>

